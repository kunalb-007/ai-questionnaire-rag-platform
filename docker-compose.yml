# docker-compose.yml
#
# Single-service compose: the FastAPI application only.
#
# With Pinecone (managed cloud) as the vector store, there is no local
# database container to manage. This is simpler than the previous
# Qdrant-based compose and requires only an .env file with valid API keys.
#
# Usage:
#   docker compose up --build          # build and start
#   docker compose up -d               # start in background
#   docker compose logs -f app         # follow logs
#   docker compose down                # stop and remove container

version: "3.11"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-doc-intelligence
    ports:
      - "8000:8000"
    env_file:
      # Copy .env.example to .env and fill in your API keys before running.
      - .env
    # Reload on code changes when ENVIRONMENT=development is set in .env.
    # Remove the command override for production (uses the CMD from Dockerfile).
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s